<!DOCTYPE html>
<html lang="en" data-theme="lcars">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploration - ST:NH Wiki</title>
    <meta name="description" content="Anomaly categories, archaeological sites, outcomes, and events.">
    <meta property="og:title" content="Exploration - ST:NH Wiki">
    <meta property="og:description" content="Anomaly categories, archaeological sites, outcomes, and events.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ST:NH Wiki">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("stnh-theme") || "lcars");</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header id="masthead">
        <div class="header-inner">
            <div class="site-title">
                <a href="index.html" class="site-logo-link"><h1>ST:NH <span class="accent">Wiki</span></h1></a>
            </div>
            <div class="header-search">
                <input type="text" id="search-input" placeholder="Search anomalies, archaeology..." data-i18n-placeholder="ui.search.exploration" autocomplete="off">
            </div>
            <div class="header-controls">
                <select id="lang-select" title="Language">
                    <option value="english">English</option>
                    <option value="german">Deutsch</option>
                    <option value="french">Fran&ccedil;ais</option>
                    <option value="spanish">Espa&ntilde;ol</option>
                    <option value="russian">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>
                    <option value="polish">Polski</option>
                    <option value="braz_por">Portugu&ecirc;s</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Wiki Navigation -->
    <nav id="wiki-nav">
        <div class="nav-inner"></div>
    </nav>

    <!-- Global Search Results -->
    <div id="global-search-results" class="global-search-results hidden"></div>

    <!-- Filter Bar -->
    <div id="filter-bar">
        <div class="filter-inner">
            <!-- Main tab buttons -->
            <div class="filter-group tab-buttons">
                <button class="tab-btn active" data-tab="anomalies"   data-i18n="ui.tab.anomalies">Anomalies</button>
                <button class="tab-btn"        data-tab="archaeology"  data-i18n="ui.tab.archaeology">Archaeology</button>
            </div>

            <!-- Anomalies: level range filter -->
            <div class="tier-filter-wrap" id="filter-level-group">
                <span class="tier-filter-label">Level: <strong id="level-filter-display">1&#8211;8</strong></span>
                <div class="tier-range-wrap inline">
                    <div class="tier-range-track"><div class="tier-range-fill" id="level-filter-fill"></div></div>
                    <input type="range" id="filter-level-start" min="1" max="8" value="1" step="1">
                    <input type="range" id="filter-level-end"   min="1" max="8" value="8" step="1">
                </div>
            </div>



            <div class="filter-stats" id="filter-stats">Loading...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="content-layout">
        <main id="item-list-panel">
            <div id="item-list"></div>
            <div id="pagination"></div>
        </main>
        <aside id="detail-panel" class="hidden">
            <div class="detail-header">
                <button id="detail-close" title="Close">&#10005;</button>
                <h2 id="detail-title" data-i18n="ui.detail.detail">Detail</h2>
            </div>
            <div id="detail-content"></div>
        </aside>
    </div>

    <footer id="site-footer">
        <p>ST:NH Wiki &mdash; Data from <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=688086068" target="_blank">Star Trek: New Horizons</a> mod</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui-strings.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/global-search.js"></script>
    <script src="js/common.js"></script>
    <script src="js/humanize.js"></script>
    <script src="js/ui/category-chips.js"></script>
    <script src="js/shared-render.js"></script>
    <script src="js/pages/exploration.js"></script>
</body>
</html>

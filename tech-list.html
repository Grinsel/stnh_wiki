<!DOCTYPE html>
<html lang="en" data-theme="lcars">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technologies - ST:NH Wiki</title>
    <meta name="description" content="Browse and search all ~2,000 technologies in Star Trek: New Horizons. Filter by area, category, tier, and empire.">
    <meta property="og:title" content="Technologies - ST:NH Wiki">
    <meta property="og:description" content="Browse and search all ~2,000 technologies in Star Trek: New Horizons. Filter by area, category, tier, and empire.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ST:NH Wiki">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("stnh-theme") || "lcars");</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header id="masthead">
        <div class="header-inner">
            <div class="site-title">
                <a href="index.html" class="site-logo-link"><h1>ST:NH <span class="accent">Wiki</span></h1></a>
            </div>
            <div class="header-search">
                <input type="text" id="search-input" placeholder="Search technologies..." data-i18n-placeholder="ui.search.tech" autocomplete="off">
            </div>
            <div class="header-controls">
                <select id="lang-select" title="Language">
                    <option value="english">English</option>
                    <option value="german">Deutsch</option>
                    <option value="french">Fran&ccedil;ais</option>
                    <option value="spanish">Espa&ntilde;ol</option>
                    <option value="russian">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>
                    <option value="polish">Polski</option>
                    <option value="braz_por">Portugu&ecirc;s</option>
                </select>

            </div>
        </div>
    </header>

    <!-- Wiki Navigation -->
    <nav id="wiki-nav">
        <div class="nav-inner"></div>
    </nav>

    <!-- Global Search Results -->
    <div id="global-search-results" class="global-search-results hidden"></div>

    <!-- Filter Bar -->
    <div id="filter-bar">
        <div class="filter-inner">
            <div class="filter-group view-mode-group">
                <span class="view-mode-btn active" data-i18n="ui.view.list_view">☰ List</span>
                <a href="tech.html" class="view-mode-btn" style="text-decoration:none" data-i18n="ui.view.tree_view">⌥ Tree</a>
            </div>
            <div id="filter-area-chips" class="cat-chip-bar"></div>
            <div class="filter-group" style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
                <label data-i18n="ui.filter.category">Category</label>
                <select id="filter-category" title="Category">
                    <option value="" data-i18n="ui.filter.all_categories">All Categories</option>
                </select>
                <div class="tier-filter-wrap">
                    <span class="tier-filter-label">Tier: <strong id="tier-filter-display">0–11</strong></span>
                    <div class="tier-range-wrap inline">
                        <div class="tier-range-track"><div class="tier-range-fill" id="tier-filter-fill"></div></div>
                        <input type="range" id="filter-tier-start" min="0" max="11" value="0" step="1">
                        <input type="range" id="filter-tier-end" min="0" max="11" value="11" step="1">
                    </div>
                </div>
                <div class="empire-autocomplete" style="position:relative">
                    <label data-i18n="ui.filter.empire" style="white-space:nowrap">Empire</label>
                    <input type="text" id="empire-search" placeholder="All Empires" data-i18n-placeholder="ui.filter.empire_placeholder" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
                    <span class="empire-autocomplete-arrow" aria-hidden="true"></span>
                    <div id="empire-dropdown" class="autocomplete-dropdown hidden" role="listbox"></div>
                </div>
            </div>
            <div class="filter-stats" id="filter-stats">Loading...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="content-layout">
        <main id="item-list-panel">
            <div id="item-list"></div>
            <div id="pagination"></div>
        </main>
        <aside id="detail-panel" class="hidden">
            <div class="detail-header">
                <button id="detail-close" title="Close">&#10005;</button>
                <h2 id="detail-title">Detail</h2>
            </div>
            <div id="detail-content"></div>
        </aside>
    </div>

    <footer id="site-footer">
        <p>ST:NH Wiki &mdash; Data from <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=688086068" target="_blank">Star Trek: New Horizons</a> mod</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui-strings.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/global-search.js"></script>
    <script src="js/common.js"></script>
    <script src="js/humanize.js"></script>
    <script src="js/ui/category-chips.js"></script>
    <script src="js/shared-render.js"></script>
    <script src="js/pages/tech-list.js"></script>
</body>
</html>

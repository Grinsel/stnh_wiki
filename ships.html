<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ships - ST:NH Wiki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header id="masthead">
        <div class="header-inner">
            <div class="site-title">
                <h1>ST:NH <span class="accent">Wiki</span></h1>
            </div>
            <div class="header-search">
                <input type="text" id="search-input" placeholder="Search ships &amp; components..." data-i18n-placeholder="ui.search.ships" autocomplete="off">
            </div>
            <div class="header-controls">
                <select id="lang-select" title="Language">
                    <option value="english">English</option>
                    <option value="german">Deutsch</option>
                    <option value="french">Fran&ccedil;ais</option>
                    <option value="spanish">Espa&ntilde;ol</option>
                    <option value="russian">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>
                    <option value="polish">Polski</option>
                    <option value="braz_por">Portugu&ecirc;s</option>
                </select>
                <div class="font-size-control" title="Text Size">
                    <span class="font-size-label">Text</span>
                    <button id="font-size-down" aria-label="Decrease text size">&minus;</button>
                    <button id="font-size-up" aria-label="Increase text size">+</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Wiki Navigation -->
    <nav id="wiki-nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-link" data-i18n="ui.nav.hub">Hub</a>
            <a href="events.html" class="nav-link" data-i18n="ui.nav.events">Events</a>
            <a href="tech.html" class="nav-link" data-i18n="ui.nav.tech">Tech Tree</a>
            <a href="ships.html" class="nav-link" data-i18n="ui.nav.ships">Ships</a>
            <a href="buildings.html" class="nav-link" data-i18n="ui.nav.buildings">Buildings</a>
            <a href="traits.html" class="nav-link" data-i18n="ui.nav.traits">Traits</a>
            <a href="governments.html" class="nav-link" data-i18n="ui.nav.governments">Governments</a>
            <a href="megastructures.html" class="nav-link" data-i18n="ui.nav.megastructures">Megastructures</a>
            <a href="anomalies.html" class="nav-link" data-i18n="ui.nav.anomalies">Anomalies</a>
            <a href="empires.html" class="nav-link" data-i18n="ui.nav.empires">Empires</a>
            <a href="economy.html" class="nav-link" data-i18n="ui.nav.economy">Economy</a>
        </div>
    </nav>

    <!-- Filter Bar -->
    <div id="filter-bar">
        <div class="filter-inner">
            <div class="filter-group tab-buttons">
                <button class="tab-btn active" data-tab="ships" data-i18n="ui.tab.ships">Ships</button>
                <button class="tab-btn" data-tab="components" data-i18n="ui.tab.components">Components</button>
            </div>
            <div class="filter-group" id="filter-class-group">
                <label data-i18n="ui.filter.class">Class</label>
                <select id="filter-class">
                    <option value="" data-i18n="ui.filter.all_classes">All Classes</option>
                </select>
            </div>
            <div class="filter-group hidden" id="filter-size-group">
                <label data-i18n="ui.filter.size">Size</label>
                <select id="filter-size">
                    <option value="" data-i18n="ui.filter.all_sizes">All Sizes</option>
                </select>
            </div>
            <div class="filter-group hidden" id="filter-comptype-group">
                <label data-i18n="ui.filter.type">Type</label>
                <select id="filter-comptype">
                    <option value="" data-i18n="ui.filter.all_types">All Types</option>
                    <option value="weapon">Weapon</option>
                    <option value="utility">Utility</option>
                    <option value="strike_craft">Strike Craft</option>
                </select>
            </div>
            <div class="filter-stats" id="filter-stats">Loading...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="content-layout">
        <main id="item-list-panel">
            <div id="item-list"></div>
            <div id="pagination"></div>
        </main>
        <aside id="detail-panel" class="hidden">
            <div class="detail-header">
                <button id="detail-close" title="Close">&#10005;</button>
                <h2 id="detail-title" data-i18n="ui.detail.detail">Detail</h2>
            </div>
            <div id="detail-content"></div>
        </aside>
    </div>

    <footer id="site-footer">
        <p>ST:NH Wiki &mdash; Data from <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=688086068" target="_blank">Star Trek: New Horizons</a> mod</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui-strings.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/common.js"></script>
    <script src="js/humanize.js"></script>
    <script src="js/shared-render.js"></script>
    <script src="js/pages/ships.js"></script>
</body>
</html>

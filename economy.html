<!DOCTYPE html>
<html lang="en" data-theme="lcars">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economy - ST:NH Wiki</title>
    <meta name="description" content="Buildings, districts, jobs, resources, megastructures, and relics.">
    <meta property="og:title" content="Economy - ST:NH Wiki">
    <meta property="og:description" content="Buildings, districts, jobs, resources, megastructures, and relics.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ST:NH Wiki">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("stnh-theme") || "lcars");</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header id="masthead">
        <div class="header-inner">
            <div class="site-title">
                <a href="index.html" class="site-logo-link"><h1>ST:NH <span class="accent">Wiki</span></h1></a>
            </div>
            <div class="header-search">
                <input type="text" id="search-input" placeholder="Search buildings, jobs, megastructures..." data-i18n-placeholder="ui.search.economy" autocomplete="off">
            </div>
            <div class="header-controls">
                <select id="lang-select" title="Language">
                    <option value="english">English</option>
                    <option value="german">Deutsch</option>
                    <option value="french">Fran&ccedil;ais</option>
                    <option value="spanish">Espa&ntilde;ol</option>
                    <option value="russian">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>
                    <option value="polish">Polski</option>
                    <option value="braz_por">Portugu&ecirc;s</option>
                </select>

            </div>
        </div>
    </header>

    <!-- Wiki Navigation -->
    <nav id="wiki-nav">
        <div class="nav-inner"></div>
    </nav>

    <!-- Global Search Results -->
    <div id="global-search-results" class="global-search-results hidden"></div>

    <!-- Active Search Banner (only when arriving from the full-results page) -->
    <div id="active-search-banner" class="active-search-banner hidden">
        <span class="active-search-label" data-i18n="ui.search.active_filter">Active search filter:</span>
        <span class="active-search-query" id="active-search-query"></span>
        <button type="button" class="active-search-clear" id="active-search-clear"
                data-i18n="ui.search.clear_filter"
                data-i18n-title="ui.search.clear_filter_tooltip">Clear search</button>
    </div>

    <!-- Filter Bar -->
    <div id="filter-bar">
        <div class="filter-inner">
            <div class="filter-group tab-buttons">
                <button class="tab-btn active" data-tab="buildings"      data-i18n="ui.tab.buildings">Buildings</button>
                <button class="tab-btn"        data-tab="districts"      data-i18n="ui.tab.districts">Districts</button>
                <button class="tab-btn"        data-tab="jobs"           data-i18n="ui.tab.jobs">Jobs</button>
                <button class="tab-btn"        data-tab="resources"      data-i18n="ui.tab.resources">Resources</button>
                <button class="tab-btn"        data-tab="deposits"       data-i18n="ui.tab.deposits">Deposits</button>
                <button class="tab-btn"        data-tab="megastructures" data-i18n="ui.tab.megastructures">Megastructures</button>
                <button class="tab-btn"        data-tab="relics"         data-i18n="ui.tab.relics">Relics</button>
            </div>
            <!-- Buildings: category chips -->
            <div id="filter-category-chips" class="cat-chip-bar"></div>
            <!-- Jobs / Resources: category dropdown -->
            <div class="filter-group hidden" id="filter-category-group">
                <label data-i18n="ui.filter.category">Category</label>
                <select id="filter-category">
                    <option value="" data-i18n="ui.filter.all_categories">All Categories</option>
                </select>
            </div>
            <!-- Resources: show-unused toggle -->
            <div class="filter-group hidden" id="filter-show-unused-group">
                <label><input type="checkbox" id="filter-show-unused"> <span data-i18n="ui.filter.show_unused">Show unused</span></label>
            </div>
            <div class="filter-stats" id="filter-stats">Loading...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="content-layout">
        <main id="item-list-panel">
            <div id="item-list"></div>
            <div id="pagination"></div>
        </main>
        <aside id="detail-panel" class="hidden">
            <div class="detail-header">
                <button id="detail-close" title="Close">&#10005;</button>
                <h2 id="detail-title" data-i18n="ui.detail.detail">Detail</h2>
            </div>
            <div id="detail-content"></div>
        </aside>
    </div>

    <footer id="site-footer">
        <p>ST:NH Wiki &mdash; Data from <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=688086068" target="_blank">Star Trek: New Horizons</a> mod</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui-strings.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/global-search.js"></script>
    <script src="js/common.js"></script>
    <script src="js/humanize.js"></script>
    <script src="js/ui/category-chips.js"></script>
    <script src="js/shared-render.js"></script>
    <script src="js/ship-viewer.js"></script>
    <script src="js/pages/economy-hub.js"></script>
</body>
</html>

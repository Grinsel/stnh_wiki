<!DOCTYPE html>
<html lang="en" data-theme="lcars">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empires - ST:NH Wiki</title>
    <meta name="description" content="Prescripted empires, species classes, factions, and portraits.">
    <meta property="og:title" content="Empires - ST:NH Wiki">
    <meta property="og:description" content="Prescripted empires, species classes, factions, and portraits.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ST:NH Wiki">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("stnh-theme") || "lcars");</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header id="masthead">
        <div class="header-inner">
            <div class="site-title">
                <a href="index.html" class="site-logo-link"><h1>ST:NH <span class="accent">Wiki</span></h1></a>
            </div>
            <div class="header-search">
                <input type="text" id="search-input" placeholder="Search empires &amp; species..." data-i18n-placeholder="ui.search.empires" autocomplete="off">
            </div>
            <div class="header-controls">
                <select id="lang-select" title="Language">
                    <option value="english">English</option>
                    <option value="german">Deutsch</option>
                    <option value="french">Fran&ccedil;ais</option>
                    <option value="spanish">Espa&ntilde;ol</option>
                    <option value="russian">&#1056;&#1091;&#1089;&#1089;&#1082;&#1080;&#1081;</option>
                    <option value="polish">Polski</option>
                    <option value="braz_por">Portugu&ecirc;s</option>
                </select>

            </div>
        </div>
    </header>

    <!-- Wiki Navigation -->
    <nav id="wiki-nav">
        <div class="nav-inner"></div>
    </nav>

    <!-- Global Search Results -->
    <div id="global-search-results" class="global-search-results hidden"></div>

    <!-- Filter Bar -->
    <div id="filter-bar">
        <div class="filter-inner">
            <div class="filter-group tab-buttons">
                <button class="tab-btn active" data-tab="empires" data-i18n="ui.tab.empires">Empires</button>
                <button class="tab-btn" data-tab="species" data-i18n="ui.tab.species">Species</button>
                <button class="tab-btn" data-tab="traits" data-i18n="ui.tab.traits">Leader Traits</button>
            </div>
            <div class="filter-group" id="view-toggle-group">
                <button class="tab-btn active" id="view-list-btn" data-i18n="ui.view.list">&#9776; List</button>
                <button class="tab-btn" id="view-map-btn" data-i18n="ui.view.map">&#10022; Galaxy Map</button>
            </div>
            <div class="filter-group quadrant-filter-group" id="filter-quadrant-group">
                <button class="tab-btn quadrant-btn active" data-quadrant="" data-i18n="ui.quadrant.all">All</button>
                <button class="tab-btn quadrant-btn q-alpha" data-quadrant="alpha" data-i18n="ui.quadrant.alpha">α Alpha</button>
                <button class="tab-btn quadrant-btn q-beta"  data-quadrant="beta" data-i18n="ui.quadrant.beta">β Beta</button>
                <button class="tab-btn quadrant-btn q-gamma" data-quadrant="gamma" data-i18n="ui.quadrant.gamma">γ Gamma</button>
                <button class="tab-btn quadrant-btn q-delta" data-quadrant="delta" data-i18n="ui.quadrant.delta">δ Delta</button>
                <button class="tab-btn quadrant-btn q-major" data-quadrant="major" data-i18n="ui.quadrant.major">★ Major</button>
                <button class="tab-btn quadrant-btn q-alt"   data-quadrant="alt" data-i18n="ui.quadrant.alt">◈ Alt</button>
            </div>
            <div class="filter-group hidden" id="filter-archetype-group">
                <label data-i18n="ui.filter.archetype">Archetype</label>
                <select id="filter-archetype">
                    <option value="" data-i18n="ui.filter.all_archetypes">All Archetypes</option>
                </select>
            </div>
            <div class="filter-group hidden" id="filter-class-group">
                <label data-i18n="ui.filter.class">Class</label>
                <select id="filter-class">
                    <option value="" data-i18n="ui.filter.all_classes">All Classes</option>
                </select>
            </div>
            <div class="filter-stats" id="filter-stats">Loading...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="content-layout">
        <main id="item-list-panel">
            <div id="item-list"></div>
            <div id="pagination"></div>
            <div id="galaxy-map-container" class="hidden" style="border-radius:8px;overflow:hidden"></div>
        </main>
        <aside id="detail-panel" class="hidden">
            <div class="detail-header">
                <button id="detail-close" title="Close">&#10005;</button>
                <h2 id="detail-title" data-i18n="ui.detail.detail">Detail</h2>
                <button id="detail-view-on-map" class="tab-btn hidden" style="margin-left:auto;font-size:0.75rem;padding:3px 9px;white-space:nowrap">&#9678; View on Map</button>
            </div>
            <div id="detail-content"></div>
        </aside>
    </div>

    <footer id="site-footer">
        <p>ST:NH Wiki &mdash; Data from <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=688086068" target="_blank">Star Trek: New Horizons</a> mod</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui-strings.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/global-search.js"></script>
    <script src="js/common.js"></script>
    <script src="js/humanize.js"></script>
    <script src="js/shared-render.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/pages/galaxy-map.js"></script>
    <script src="js/pages/empires.js"></script>
</body>
</html>
